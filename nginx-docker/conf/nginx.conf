user nginx;
worker_processes auto;
worker_rlimit_nofile 1024;
worker_shutdown_timeout 30s;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'kex=$ssl_curve proto=$server_protocol rs=$ssl_session_reused '
                    'rt=$request_time uct=$upstream_connect_time vh=$host';

    access_log /var/log/nginx/access.log main;

    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 65s;
    reset_timedout_connection on;
    send_timeout 30s;
    sendfile on;
    sendfile_max_chunk 1m;
    tcp_nopush on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/javascript text/plain text/xml;

    charset utf-8;
    server_tokens off;
    types_hash_max_size 2048;

    map $http_upgrade $connection_keepalive {
        default upgrade;
        "" "";
    }

    # Rate-limit key: IPv6 clients count per /64, like the host firewall.
    map $binary_remote_addr $limit_key {
        default $binary_remote_addr;
        "~(?s)^(.{8}).{8}$" $1;
    }

    map $http_origin $origin_host {
        default "";
        ~^https?://([^:/]+)(:\d+)?/?$ $1;
    }

    # CORS: the same host or its parent.
    map "$origin_host:$host" $validated_cors_origin {
        default "";
        ~^(.+):([^.]+\.)?\1$ $http_origin;
    }

    limit_conn http-conn 64;
    limit_conn_status 429;
    limit_conn_zone $limit_key zone=http-conn:1m;

    limit_req_status 429;

    open_file_cache max=64 inactive=60s;
    open_file_cache_errors on;
    open_file_cache_min_uses 2;
    open_file_cache_valid 30s;

    include /etc/nginx/conf.d/*.conf;
}

stream {
    # Rate-limit key: IPv6 clients count per /64, like the host firewall.
    map $binary_remote_addr $limit_key {
        default $binary_remote_addr;
        "~(?s)^(.{8}).{8}$" $1;
    }

    include /etc/nginx/stream.d/*.conf;
}
