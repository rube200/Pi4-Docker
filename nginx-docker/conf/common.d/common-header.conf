    add_header Access-Control-Allow-Origin '$validated_cors_origin' always;
    add_header Cross-Origin-Embedder-Policy 'require-corp' always;
    add_header Cross-Origin-Opener-Policy 'same-origin' always;
    add_header Cross-Origin-Resource-Policy 'same-origin' always;
    add_header Permissions-Policy 'accelerometer=(), autoplay=(), bluetooth=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()' always;
    add_header Referrer-Policy 'same-origin' always;
    add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains; preload' always;
    # Accept-Encoding is listed because gzip_vary stays at its default (off).
    add_header Vary 'Accept-Encoding, Origin' always;
    add_header X-Content-Type-Options 'nosniff' always;
    add_header X-Frame-Options 'SAMEORIGIN' always;
    add_header X-Permitted-Cross-Domain-Policies 'none' always;
    add_header X-XSS-Protection '0' always;
