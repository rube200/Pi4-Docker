    listen 443 quic;
    listen [::]:443 quic;
    listen 443 ssl;
    listen [::]:443 ssl;

    include /etc/nginx/common.d/ssl.conf;
    include /etc/nginx/common.d/common-header.conf;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
        expires 1y;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        alias /usr/share/nginx/html/robots.txt;
        expires 1y;
        access_log off;
        log_not_found off;
    }
