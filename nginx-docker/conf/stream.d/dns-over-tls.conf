limit_conn_zone $limit_key zone=dot-conn:1m;

upstream pi-hole-dns {
    zone pi-hole-dns 64k;

    server 172.28.0.3:53;
    server [fd28::3]:53;
}

server {
    listen 853 ssl;
    listen [::]:853 ssl;

    include /etc/nginx/common.d/ssl-common.conf;

    ssl_session_cache shared:StreamSSL:2m;

    limit_conn dot-conn 32;

    proxy_connect_timeout 2s;
    proxy_timeout 2m;

    proxy_pass pi-hole-dns;
}
