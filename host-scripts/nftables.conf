#!/usr/sbin/nft -f

define RATE_PREFIX6 = ffff:ffff:ffff:ffff::

table inet pi4d_filter
delete table inet pi4d_filter

table inet pi4d_filter {
  set trusted_base {
    type ipv4_addr
    flags interval
    auto-merge
  }

  set trusted_base6 {
    type ipv6_addr
    flags interval
    auto-merge
    elements = { fe80::/10 }
  }

  set dns4 {
    type ipv4_addr
    size 16384
    flags dynamic
    timeout 5m
  }

  set dns6 {
    type ipv6_addr
    size 16384
    flags dynamic
    timeout 5m
  }

  set http4 {
    type ipv4_addr
    size 16384
    flags dynamic
    timeout 5m
  }

  set http6 {
    type ipv6_addr
    size 16384
    flags dynamic
    timeout 5m
  }

  set icmp4 {
    type ipv4_addr
    size 16384
    flags dynamic
    timeout 5m
  }

  set icmp6 {
    type ipv6_addr
    size 16384
    flags dynamic
    timeout 5m
  }

  set wg4 {
    type ipv4_addr
    size 16384
    flags dynamic
    timeout 5m
  }

  set wg6 {
    type ipv6_addr
    size 16384
    flags dynamic
    timeout 5m
  }

  chain container_no_host {
    limit rate 10/minute burst 5 packets log prefix "[FIREWALL-CONTAINER] "
    drop
  }

  chain from_container {
    ip saddr 172.28.0.5 tcp dport 22 accept
    ip6 saddr fd28::5 tcp dport 22 accept
    tcp dport 22 limit rate 10/minute burst 5 packets log prefix "[FIREWALL-CONTAINER-SSH] "
    tcp dport 22 drop
    ip saddr { 172.28.0.2, 172.28.0.4 } meta l4proto { tcp, udp } jump container_no_host
    ip6 saddr { fd28::2, fd28::4, fe80::/10 } meta l4proto { tcp, udp } jump container_no_host
    accept
  }

  chain protection_ddos {
    update @http4 { ip saddr limit rate 10/second burst 20 packets } accept
    update @http6 { ip6 saddr and $RATE_PREFIX6 limit rate 10/second burst 20 packets } accept
    limit rate 10/minute burst 5 packets log prefix "[FIREWALL-HTTP] "
    drop
  }

  chain protection_dhcp {
    limit rate 20/second burst 120 packets accept
    limit rate 10/minute burst 5 packets log prefix "[FIREWALL-DHCP] "
    drop
  }

  chain protection_dns {
    update @dns4 { ip saddr limit rate 300/minute burst 100 packets } accept
    update @dns6 { ip6 saddr and $RATE_PREFIX6 limit rate 300/minute burst 100 packets } accept
    limit rate 10/minute burst 5 packets log prefix "[FIREWALL-DNS] "
    drop
  }

  chain protection_ping {
    update @icmp4 { ip saddr limit rate 5/second burst 10 packets } accept
    update @icmp6 { ip6 saddr and $RATE_PREFIX6 limit rate 5/second burst 10 packets } accept
    limit rate 10/minute burst 5 packets log prefix "[FIREWALL-PING] "
    drop
  }

  chain protection_wireguard {
    update @wg4 { ip saddr limit rate 30/minute burst 10 packets } accept
    update @wg6 { ip6 saddr and $RATE_PREFIX6 limit rate 30/minute burst 10 packets } accept
    limit rate 10/minute burst 5 packets log prefix "[FIREWALL-WIREGUARD] "
    drop
  }

  chain input {
    type filter hook input priority filter; policy accept;

    ct state invalid drop
    ct state established,related accept

    iifname "lo" accept

    iifname { "br-*", "docker*" } jump from_container

    ip protocol igmp ip ttl 1 accept
    icmpv6 type { mld-listener-done, mld-listener-query, mld-listener-report, mld2-listener-report } ip6 saddr fe80::/10 accept
    icmpv6 type { nd-neighbor-advert, nd-neighbor-solicit, nd-router-advert, nd-router-solicit } ip6 hoplimit 255 accept

    icmp type { destination-unreachable, parameter-problem, time-exceeded } accept
    icmpv6 type { destination-unreachable, packet-too-big, parameter-problem, time-exceeded } accept

    icmp type echo-request jump protection_ping
    icmpv6 type echo-request jump protection_ping

    ip saddr 0.0.0.0 udp dport 67 jump protection_dhcp
    ip saddr @trusted_base udp dport 67 jump protection_dhcp
    udp sport 67 udp dport 68 jump protection_dhcp
    ip6 saddr fe80::/10 udp dport 547 jump protection_dhcp
    ip6 saddr fe80::/10 udp sport 547 udp dport 546 jump protection_dhcp

    ip saddr @trusted_base tcp dport { 22, 53, 80, 443, 853, 8443 } accept
    ip6 saddr @trusted_base6 tcp dport { 22, 53, 80, 443, 853, 8443 } accept
    ip saddr @trusted_base udp dport { 53, 443, 8443 } accept
    ip6 saddr @trusted_base6 udp dport { 53, 443, 8443 } accept

    tcp dport 22 drop
    tcp dport { 80, 443 } jump protection_ddos
    udp dport 443 jump protection_ddos
    tcp dport { 53, 853, 8443 } jump protection_dns
    udp dport { 53, 8443 } jump protection_dns
    udp dport 51820 jump protection_wireguard

    meta pkttype { broadcast, multicast } drop
    limit rate 10/minute burst 5 packets log prefix "[FIREWALL-IN] "
    drop
  }

  chain forward {
    type filter hook forward priority filter; policy accept;

    ct state invalid drop
    ct state established,related accept

    iifname { "br-*", "docker*" } accept

    icmp type { destination-unreachable, parameter-problem, time-exceeded } accept
    icmpv6 type { destination-unreachable, packet-too-big, parameter-problem, time-exceeded } accept

    ip saddr @trusted_base accept
    ip6 saddr @trusted_base6 accept

    ct status dnat tcp dport { 80, 443 } jump protection_ddos
    ct status dnat udp dport 443 jump protection_ddos
    ct status dnat tcp dport { 53, 853, 8443 } jump protection_dns
    ct status dnat udp dport { 53, 8443 } jump protection_dns
    ct status dnat udp dport 51820 jump protection_wireguard
    ct status dnat limit rate 10/minute burst 5 packets log prefix "[FIREWALL-FORWARD] "
    ct status dnat drop

    ip daddr @trusted_base accept
    ip6 daddr @trusted_base6 accept
    oifname { "br-*", "docker*" } accept

    limit rate 10/minute burst 5 packets log prefix "[FIREWALL-FORWARD] "
    drop
  }

  chain output {
    type filter hook output priority filter; policy accept;

    oifname "lo" accept
    oifname { "br-*", "docker*" } accept

    ip daddr @trusted_base tcp sport 22 accept
    ip6 daddr @trusted_base6 tcp sport 22 accept
    tcp sport 22 drop
  }
}
