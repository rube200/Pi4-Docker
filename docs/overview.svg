<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 480" width="1330" height="480" role="img" aria-labelledby="title">
  <title id="title">Pi4-Docker overview: clients, services and ports</title>
  <style>
    :root {
      --bg: #ffffff;
      --box: #f6f8fa;
      --group: #fbfcfd;
      --line: #57606a;
      --text: #1f2328;
      --muted: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --box: #161b22;
        --group: #10151c;
        --line: #8b949e;
        --text: #e6edf3;
        --muted: #58a6ff;
      }
    }
    text {
      dominant-baseline: central;
      fill: var(--text);
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      text-anchor: middle;
    }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
    .group { fill: var(--group); stroke: var(--line); stroke-width: 1.2; }
    .group-title { fill: var(--muted); }
    .edge { fill: none; stroke: var(--line); stroke-width: 1.2; marker-end: url(#arrow); }
    .head { fill: var(--line); }
    .label { paint-order: stroke; stroke: var(--bg); stroke-linejoin: round; stroke-width: 6px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
